version: '3.8'
services:
  zookeeper:
    image: wurstmeister/zookeeper:3.4.6
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka:2.13-2.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  order-service:
    build: ./order-service
    ports:
      - "3001:3000"
    environment:
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: redis
    depends_on:
      - kafka
      - redis

  inventory-service:
    build: ./inventory-service
    ports:
      - "3002:3000"
    environment:
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: redis
    depends_on:
      - kafka
      - redis

  payment-service:
    build: ./payment-service
    ports:
      - "3003:3000"
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka

  email-service:
    build: ./email-service
    ports:
      - "3004:3000"
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka
