version: '3.8'
services:
  zookeeper:
    image: bitnami/zookeeper
    # to survive the container restart
    tmpfs: "/zktmp"
    environment:
      ALLOW_ANONYMOUS_LOGIN: 'yes'
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/bitnami/kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  order-service:
    build: ./order-service
    ports:
      - "3001:3000"
    environment:
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: redis
    depends_on:
      - kafka
      - redis

  inventory-service:
    build: ./inventory-service
    ports:
      - "3002:3000"
    environment:
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: redis
    depends_on:
      - kafka
      - redis

  payment-service:
    build: ./payment-service
    ports:
      - "3003:3000"
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka

  email-service:
    build: ./email-service
    ports:
      - "3004:3000"
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka
volumes:
  kafka_data:
    driver: local
